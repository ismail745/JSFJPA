<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:p="http://primefaces.org/ui">

<h:head>
    <title>E-Commerce JSF - Accueil</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <h:outputStylesheet name="css/style.css" />
</h:head>

<h:body>
    <div class="container">
        <header>
            <h1>Bienvenue sur notre boutique en ligne</h1>
            <p:menubar>
                <p:menuitem value="Accueil" outcome="index" icon="pi pi-home" />
                <p:menuitem value="Produits" outcome="vitrine" icon="pi pi-shopping-bag" />
                <p:menuitem value="Panier" outcome="panier" icon="pi pi-shopping-cart" />
                
                <f:facet name="options">
                    <h:form rendered="#{!utilisateurBean.connecte}">
                        <p:button value="Connexion" outcome="connexion" icon="pi pi-sign-in" styleClass="ui-button-info" />
                        <p:button value="Inscription" outcome="inscription" icon="pi pi-user-plus" styleClass="ui-button-success" style="margin-left: 5px;" />
                    </h:form>
                    <h:form rendered="#{utilisateurBean.connecte}">
                        <p:outputLabel value="Bonjour, #{utilisateurBean.utilisateurConnecte.prenom}" style="margin-right: 10px;" />
                        <p:commandButton value="Déconnexion" action="#{utilisateurBean.deconnecter}" icon="pi pi-sign-out" styleClass="ui-button-danger" />
                    </h:form>
                </f:facet>
            </p:menubar>
        </header>
        
        <main>
            <section class="hero">
                <h2>Découvrez nos produits de qualité</h2>
                <p>Une large sélection de produits à des prix compétitifs</p>
                <p:button value="Voir les produits" outcome="vitrine" styleClass="ui-button-primary" />
            </section>
            
            <section class="featured-products">
                <h2>Produits populaires</h2>
                <p:dataView value="#{vitrineBean.produits}" var="produit" rows="4" gridIcon="pi pi-th-large" listIcon="pi pi-bars">
                    <p:dataViewGridItem>
                        <div class="product-card">
                            <h:graphicImage value="#{produit.image}" alt="#{produit.nom}" styleClass="product-image" />
                            <h3>#{produit.nom}</h3>
                            <p class="price">#{produit.prix} €</p>
                            <p:commandButton value="Voir détails" action="vitrine?faces-redirect=true" styleClass="ui-button-secondary">
                                <f:param name="produitId" value="#{produit.id}" />
                            </p:commandButton>
                            <p:commandButton value="Ajouter au panier" action="#{panierBean.ajouterProduit(produit)}" update="@form" icon="pi pi-cart-plus" styleClass="ui-button-success" />
                        </div>
                    </p:dataViewGridItem>
                </p:dataView>
            </section>
        </main>
        
        <footer>
            <p>&copy; 2023 E-Commerce JSF. Tous droits réservés.</p>
        </footer>
    </div>
</h:body>
</html>

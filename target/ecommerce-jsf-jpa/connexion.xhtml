<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:p="http://primefaces.org/ui">

<h:head>
    <title>E-Commerce JSF - Connexion</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <h:outputStylesheet name="css/style.css" />
</h:head>

<h:body>
    <div class="container">
        <header>
            <h1>Connexion</h1>
            <p:menubar>
                <p:menuitem value="Accueil" outcome="index" icon="pi pi-home" />
                <p:menuitem value="Produits" outcome="vitrine" icon="pi pi-shopping-bag" />
                <p:menuitem value="Panier" outcome="panier" icon="pi pi-shopping-cart" />
            </p:menubar>
        </header>
        
        <main>
            <div class="auth-container">
                <h:form>
                    <p:panel header="Connexion à votre compte">
                        <p:messages id="messages" showDetail="true" closable="true">
                            <p:autoUpdate />
                        </p:messages>
                        
                        <div class="form-group">
                            <p:outputLabel for="email" value="Email:" />
                            <p:inputText id="email" value="#{utilisateurBean.email}" required="true" 
                                        requiredMessage="Veuillez saisir votre email" />
                        </div>
                        
                        <div class="form-group">
                            <p:outputLabel for="password" value="Mot de passe:" />
                            <p:password id="password" value="#{utilisateurBean.motDePasse}" required="true" 
                                      requiredMessage="Veuillez saisir votre mot de passe" />
                        </div>
                        
                        <div class="form-actions">
                            <p:commandButton value="Se connecter" action="#{utilisateurBean.connecter}" 
                                           update="@form" styleClass="ui-button-primary" />
                            <p:button value="S'inscrire" outcome="inscription" styleClass="ui-button-secondary" />
                        </div>
                    </p:panel>
                </h:form>
            </div>
        </main>
        
        <footer>
            <p>&copy; 2023 E-Commerce JSF. Tous droits réservés.</p>
        </footer>
    </div>
</h:body>
</html>

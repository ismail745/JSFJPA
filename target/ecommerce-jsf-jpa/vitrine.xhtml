<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:p="http://primefaces.org/ui">

<h:head>
    <title>E-Commerce JSF - Produits</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <h:outputStylesheet name="css/style.css" />
</h:head>

<h:body>
    <div class="container">
        <header>
            <h1>Catalogue de produits</h1>
            <p:menubar>
                <p:menuitem value="Accueil" outcome="index" icon="pi pi-home" />
                <p:menuitem value="Produits" outcome="vitrine" icon="pi pi-shopping-bag" />
                <p:menuitem value="Panier" outcome="panier" icon="pi pi-shopping-cart" />
                
                <f:facet name="options">
                    <h:form rendered="#{!utilisateurBean.connecte}">
                        <p:button value="Connexion" outcome="connexion" icon="pi pi-sign-in" styleClass="ui-button-info" />
                        <p:button value="Inscription" outcome="inscription" icon="pi pi-user-plus" styleClass="ui-button-success" style="margin-left: 5px;" />
                    </h:form>
                    <h:form rendered="#{utilisateurBean.connecte}">
                        <p:outputLabel value="Bonjour, #{utilisateurBean.utilisateurConnecte.prenom}" style="margin-right: 10px;" />
                        <p:commandButton value="Déconnexion" action="#{utilisateurBean.deconnecter}" icon="pi pi-sign-out" styleClass="ui-button-danger" />
                    </h:form>
                </f:facet>
            </p:menubar>
        </header>
        
        <main>
            <h:form id="searchForm">
                <div class="search-container">
                    <div class="search-box">
                        <p:inputText value="#{vitrineBean.motCleRecherche}" placeholder="Rechercher un produit..." />
                        <p:commandButton value="Rechercher" action="#{vitrineBean.rechercher}" update="@form :productList" icon="pi pi-search" />
                    </div>
                    
                    <div class="filter-box">
                        <p:selectOneMenu value="#{vitrineBean.categorieSelectionneeId}">
                            <f:selectItem itemLabel="Toutes les catégories" itemValue="#{null}" />
                            <f:selectItems value="#{vitrineBean.categories}" var="cat" itemLabel="#{cat.nom}" itemValue="#{cat.id}" />
                            <p:ajax listener="#{vitrineBean.filtrerParCategorie(vitrineBean.categorieSelectionneeId)}" update="@form :productList" />
                        </p:selectOneMenu>
                    </div>
                </div>
            </h:form>
            
            <h:form id="productList">
                <p:dataGrid value="#{vitrineBean.produits}" var="produit" columns="3" layout="grid"
                            rows="9" paginator="true" paginatorPosition="bottom"
                            paginatorTemplate="{CurrentPageReport} {FirstPageLink} {PreviousPageLink} {PageLinks} {NextPageLink} {LastPageLink} {RowsPerPageDropdown}"
                            rowsPerPageTemplate="9,12,15">
                    
                    <div class="product-card">
                        <h:graphicImage value="#{produit.image}" alt="#{produit.nom}" styleClass="product-image" />
                        <h3>#{produit.nom}</h3>
                        <p class="description">#{produit.description}</p>
                        <p class="price">#{produit.prix} €</p>
                        <p class="stock">En stock: #{produit.stock}</p>
                        
                        <div class="product-actions">
                            <p:commandButton value="Ajouter au panier" action="#{panierBean.ajouterProduit(produit)}" 
                                           update="@form" icon="pi pi-cart-plus" styleClass="ui-button-success" />
                        </div>
                    </div>
                </p:dataGrid>
            </h:form>
        </main>
        
        <footer>
            <p>&copy; 2023 E-Commerce JSF. Tous droits réservés.</p>
        </footer>
    </div>
</h:body>
</html>
